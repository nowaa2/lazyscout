<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login · LazyShop</title>
    <link rel="stylesheet" href="/app.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">LS</span> LazyShop</a>
      <nav class="nav"><a href="/">Home</a><a href="/register">Register</a></nav>
    </header>
    <main class="container page">
      <section class="card form-card">
        <span class="eyebrow">Welcome back</span>
        <h2>Sign in to your account</h2>
        <p class="muted">Safe local demo. Use any valid email and password <code>123456789</code>.</p>
        <form action="/dashboard" method="get" aria-label="Login form">
          <label for="email">Email address</label
          ><input id="email" name="email" type="email" required placeholder="you@example.com" /><label for="password"
            >Password</label
          ><input id="password" name="password" type="password" required placeholder="••••••••" />
          <p id="login-error" class="hidden" role="alert" aria-live="polite"></p>
          <label><input type="checkbox" name="remember" style="width: auto; margin-right: 7px" /> Remember me</label
          ><button class="btn btn-primary" style="width: 100%; margin-top: 18px" type="submit">Login</button>
        </form>
        <p class="auth-note"><a href="/forgot-password">Forgot password?</a></p>
        <p class="auth-note">New here? <a href="/register">Create an account</a></p>
      </section>
    </main>
  </body>
</html>
