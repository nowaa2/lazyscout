name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The recorder tests drive a real browser.
      - name: Install Chromium
        run: npx playwright-core install --with-deps --no-progress chromium

      - name: Check for committed secrets
        run: npm run check:secrets

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the published package contents
        run: npm pack --dry-run --workspace lazyscout

      - name: Verify the CLI package on Linux
        run: npm run check:npm-package
